name: CI

# These are runnable demo applications, not a published library. CI only
# builds the executable fat JAR and attaches it as a workflow artifact.
#
# DO NOT add an `mvn deploy` step or any `mvn install` step to this workflow.
# Publishing this repository to the ParadigmShift Maven repository would make
# it appear in the libraries section of the ParadigmShift website alongside
# the actual reusable artifacts — which is explicitly NOT what these demos
# are. Distribution will be handled separately (likely via the ParadigmShift
# website / GitHub Releases) once we settle on the channel.

on:
  push:
    branches: [ main ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build executable fat JAR
        run: mvn package --no-transfer-progress

      - name: Upload demo JAR
        uses: actions/upload-artifact@v4
        with:
          name: babel-raspberry-iot-examples
          path: target/babel-raspberry-iot-examples.jar
          if-no-files-found: error
